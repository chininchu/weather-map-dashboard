<!DOCTYPE html>
<html>
  <head>
    <title>Weather Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="stylesheets/style.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <h1>Weather Dashboard</h1>
      <div class="search-section">
        <h2>Enter a City Name</h2>
        <input id="cityInput" type="text" placeholder="E.g., New York, London, Tokyo">
        <button id="searchBtn">Search</button>
        <div class="divider"><span>or</span></div>
        <button id="currentLocationBtn">Use Current Location</button>
      </div>
      <div id="currentWeather"></div>
      <div id="forecast">
        <h2>4-Day Forecast</h2>
        <div class="forecast-container"></div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js"></script>
    <script>var mapboxToken = '__MAPBOX_TOKEN__';</script>
    <script src="javascripts/weather.js"></script>
  </body>
</html>
